# Run the checks on every pull request and every push to main. The repo is public, so GitHub Actions on standard
# runners is free. Make the "tests" check required in the ruleset for main so a PR can't merge while it fails.
# The same steps as publish.yml up to the build and tests; nothing is published.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts matches package.json's allowScripts (npm 12 locally; the runner's npm 11 ignores that field)
      - run: npm ci --ignore-scripts
      # npm ci skipped every install script; run the image binaries' ones that allowScripts permits
      - run: npm rebuild gifsicle mozjpeg optipng-bin
      # The page-tools tests drive a real headless Chromium
      - run: npx playwright install --with-deps chromium

      # gulp lint applies neostandard's automatic fixes; fail if it had to change anything
      - run: npm run lint
      - name: Lint changed nothing
        run: git diff --exit-code

      - run: npm run build
      # gulp testFull fails when any test fails (it used to exit 0: fixed in 9.1.0, #399)
      - run: npm test
