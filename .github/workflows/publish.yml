# Publishes to npm when a GitHub Release is published (release-it creates the Release).
# Uses npm trusted publishing: GitHub's OIDC token proves this workflow is the publisher, so no
# npm token is stored anywhere, and npm attaches provenance (the npm page links back to this run).
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Release tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi

      # --ignore-scripts matches package.json's allowScripts (npm 12 locally; the runner's npm 11 ignores that field)
      - run: npm ci --ignore-scripts
      # npm ci skipped every install script; run the image binaries' ones that allowScripts permits
      - run: npm rebuild gifsicle mozjpeg optipng-bin

      # gulp lint applies neostandard's automatic fixes; fail if it had to change anything, so the
      # published build always comes from exactly the tagged source
      - run: npm run lint
      - name: Lint changed nothing
        run: git diff --exit-code

      - run: npm run build
      - run: npm test

      # prepublishOnly rebuilds; docs are not built here (release-it's after:bump hook does that locally)
      - run: npm publish
